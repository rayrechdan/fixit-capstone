<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 560" font-family="Arial, sans-serif" font-size="12">
  <rect width="1400" height="560" fill="#ffffff"/>
  <text x="20" y="30" font-size="20" font-weight="bold">Fixit - wireframes of the main screens (mobile first)</text>

  <!-- 1 Home / catalogue -->
  <g transform="translate(20,60)">
    <text x="0" y="0" font-weight="bold">1. Home / catalogue</text>
    <rect x="0" y="10" width="240" height="470" rx="18" fill="none" stroke="#333" stroke-width="2"/>
    <rect x="12" y="24" width="216" height="26" fill="#eee"/><text x="20" y="42">Fixit   |  Jobs  |  Log in</text>
    <rect x="12" y="60" width="216" height="60" fill="#f6f6f6" stroke="#bbb"/><text x="20" y="85">Fixed price. Fixed right.</text>
    <rect x="12" y="130" width="216" height="24" fill="none" stroke="#999"/><text x="20" y="147" fill="#777">Search a repair...</text>
    <rect x="12" y="162" width="50" height="20" rx="10" fill="#ddd"/><rect x="68" y="162" width="50" height="20" rx="10" fill="#ddd"/><rect x="124" y="162" width="50" height="20" rx="10" fill="#ddd"/>
    <text x="16" y="176" font-size="10">All</text><text x="72" y="176" font-size="10">Plumb.</text><text x="128" y="176" font-size="10">Elec.</text>
    <rect x="12" y="192" width="216" height="80" fill="none" stroke="#999"/><text x="20" y="212">Fix a leaking tap</text><text x="20" y="230" fill="#777">plumbing - 45 min</text><text x="20" y="258" font-weight="bold">$25</text>
    <rect x="12" y="282" width="216" height="80" fill="none" stroke="#999"/><text x="20" y="302">Install a ceiling fan</text><text x="20" y="320" fill="#777">electrical - 60 min</text><text x="20" y="348" font-weight="bold">$35</text>
    <rect x="12" y="372" width="216" height="80" fill="none" stroke="#999"/><text x="20" y="392">AC cleaning</text>
  </g>

  <!-- 2 Service detail + booking -->
  <g transform="translate(300,60)">
    <text x="0" y="0" font-weight="bold">2. Service detail + booking</text>
    <rect x="0" y="10" width="240" height="470" rx="18" fill="none" stroke="#333" stroke-width="2"/>
    <text x="16" y="45" font-weight="bold">Fix a leaking tap - $25</text>
    <text x="16" y="63" fill="#777">Fixed price, about 45 min</text>
    <rect x="12" y="76" width="160" height="24" fill="none" stroke="#999"/><text x="18" y="93" fill="#777">Address...</text>
    <rect x="178" y="76" width="50" height="24" fill="#ccc"/><text x="184" y="93">Find</text>
    <rect x="12" y="108" width="216" height="140" fill="#e8f0e8" stroke="#999"/><text x="90" y="182">MAP</text><circle cx="120" cy="170" r="7" fill="#f26b21"/>
    <rect x="12" y="258" width="216" height="24" fill="none" stroke="#999"/><text x="18" y="275" fill="#777">Date and time</text>
    <rect x="12" y="290" width="216" height="80" fill="none" stroke="#999"/><text x="18" y="308" fill="#777">Describe the problem</text>
    <rect x="12" y="384" width="216" height="34" fill="#f26b21"/><text x="80" y="406" fill="#fff" font-weight="bold">Book for $25</text>
  </g>

  <!-- 3 My jobs -->
  <g transform="translate(580,60)">
    <text x="0" y="0" font-weight="bold">3. My jobs (customer)</text>
    <rect x="0" y="10" width="240" height="470" rx="18" fill="none" stroke="#333" stroke-width="2"/>
    <text x="16" y="45" font-weight="bold">My jobs</text>
    <rect x="12" y="58" width="216" height="110" fill="none" stroke="#999"/><text x="20" y="78">Fix a leaking tap</text><rect x="150" y="66" width="70" height="18" rx="9" fill="#cde"/><text x="156" y="79" font-size="10">on the way</text>
    <text x="20" y="98" fill="#777">Hamra, 28 Nov 10:00</text><text x="20" y="118" fill="#777">Pro: Karim (4.8)</text>
    <rect x="12" y="180" width="216" height="140" fill="none" stroke="#999"/><text x="20" y="200">AC cleaning</text><rect x="150" y="188" width="70" height="18" rx="9" fill="#cec"/><text x="165" y="201" font-size="10">done</text>
    <text x="20" y="224">Rate:  * * * * *</text><rect x="20" y="234" width="200" height="40" fill="none" stroke="#bbb"/><rect x="20" y="282" width="80" height="24" fill="#f26b21"/><text x="30" y="298" fill="#fff">Send</text>
  </g>

  <!-- 4 Pro dashboard -->
  <g transform="translate(860,60)">
    <text x="0" y="0" font-weight="bold">4. Pro dashboard</text>
    <rect x="0" y="10" width="240" height="470" rx="18" fill="none" stroke="#333" stroke-width="2"/>
    <text x="16" y="45" font-weight="bold">Open jobs in plumbing</text>
    <rect x="12" y="58" width="216" height="90" fill="none" stroke="#999"/><text x="20" y="78">Unclog a sink - $30</text><text x="20" y="96" fill="#777">Achrafieh, tomorrow 9:00</text><rect x="20" y="110" width="80" height="26" fill="#f26b21"/><text x="34" y="127" fill="#fff">Accept</text>
    <text x="16" y="180" font-weight="bold">My jobs</text>
    <rect x="12" y="192" width="216" height="90" fill="none" stroke="#999"/><text x="20" y="212">Fix a leaking tap</text><text x="20" y="230" fill="#777">accepted</text><rect x="20" y="244" width="120" height="26" fill="#333"/><text x="30" y="261" fill="#fff">Mark on the way</text>
  </g>

  <!-- 5 Login / signup -->
  <g transform="translate(1140,60)">
    <text x="0" y="0" font-weight="bold">5. Log in / Sign up</text>
    <rect x="0" y="10" width="240" height="470" rx="18" fill="none" stroke="#333" stroke-width="2"/>
    <text x="16" y="50" font-weight="bold">Create an account</text>
    <rect x="12" y="64" width="216" height="24" fill="none" stroke="#999"/><text x="18" y="81" fill="#777">Name</text>
    <rect x="12" y="96" width="216" height="24" fill="none" stroke="#999"/><text x="18" y="113" fill="#777">Email</text>
    <rect x="12" y="128" width="216" height="24" fill="none" stroke="#999"/><text x="18" y="145" fill="#777">Password</text>
    <text x="16" y="174">( ) Customer   ( ) Pro</text>
    <rect x="12" y="184" width="216" height="24" fill="none" stroke="#999"/><text x="18" y="201" fill="#777">Trade (pros only)</text>
    <rect x="12" y="222" width="216" height="34" fill="#f26b21"/><text x="88" y="244" fill="#fff" font-weight="bold">Sign up</text>
    <text x="30" y="280" fill="#777">Already have an account? Log in</text>
  </g>
</svg>
