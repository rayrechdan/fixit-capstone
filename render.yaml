# Render blueprint for the Fixit API (the front end is on Vercel)
services:
  - type: web
    name: fixit-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false # set in the Render dashboard (Neon connection string)
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false # the Vercel URL of the front end
